<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
    <defs>
        <style>
            .text-asset { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 64px; fill: #0F172A; }
            .text-hub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 64px; fill: #4F46E5; }
            .text-mono { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 64px; fill: #000000; }
            .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #94A3B8; letter-spacing: 1.5px; text-transform: uppercase; }
        </style>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#FFFFFF" />

    <!-- ================= COLOR VERSION ================= -->
    <g transform="translate(80, 80)">
        <!-- Icon Group -->
        <g transform="translate(0, 0)">
            <!-- Base Geometric "A" Structure -->
            <path d="M 60,10 L 110,110 L 85,110 L 60,60 L 35,110 L 10,110 Z" fill="#0F172A" />
            <path d="M 30,80 L 90,80 L 90,92 L 30,92 Z" fill="#0F172A" />

            <!-- Network Node Lines -->
            <line x1="60" y1="20" x2="60" y2="60" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" />
            <line x1="60" y1="60" x2="15" y2="40" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" />
            <line x1="60" y1="60" x2="105" y2="40" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" />
            <line x1="60" y1="60" x2="25" y2="95" stroke="#14B8A6" stroke-width="4" stroke-linecap="round" />
            <line x1="60" y1="60" x2="95" y2="95" stroke="#14B8A6" stroke-width="4" stroke-linecap="round" />

            <!-- Outer Nodes -->
            <circle cx="60" cy="20" r="7" fill="#4F46E5" />
            <circle cx="15" cy="40" r="7" fill="#4F46E5" />
            <circle cx="105" cy="40" r="7" fill="#4F46E5" />
            <circle cx="25" cy="95" r="7" fill="#14B8A6" />
            <circle cx="95" cy="95" r="7" fill="#14B8A6" />

            <!-- Central Hub Node -->
            <circle cx="60" cy="60" r="10" fill="#14B8A6" stroke="#FFFFFF" stroke-width="3" />
        </g>

        <!-- Wordmark -->
        <text x="145" y="83" class="text-asset">Asset<tspan class="text-hub">Hub</tspan></text>
    </g>

</svg>
